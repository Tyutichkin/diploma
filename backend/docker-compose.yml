services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: [ "migrate", "-path", "/migrations", "-database", "postgres://planner:planner@db:5432/planner?sslmode=disable", "up" ]

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_HTTP_ADDR: ":8080"
      APP_DB_DSN: "postgres://planner:planner@db:5432/planner?sslmode=disable"
      APP_JWT_SECRET: "change-me-super-secret"
      APP_ACCESS_TTL_MIN: "15"
      APP_REFRESH_TTL_DAYS: "30"
      APP_CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:3000"
    ports:
      - "8080:8080"

volumes:
  db_data:
